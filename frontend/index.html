<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme class before first paint (no flash). A saved choice always
      // wins; without one the app opens light.
      //
      // This script is the ONLY place the default lives. useTheme reads the class
      // this sets rather than deciding for itself, so the two can never disagree
      // and there is nothing to flash between.
      (function () {
        try {
          var saved = localStorage.getItem('iqia.theme');
          var dark = saved === 'dark';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // Storage blocked (private mode). Fall back to the same default as above.
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Iqia — a Build privacy platform on Base. Bridge, hold, pay, and trade in a shielded ZK layer."
    />
    <title>Iqia App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
